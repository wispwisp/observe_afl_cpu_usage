[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-process-tree-monitor"
version = "0.1.0"
description = "CPU usage monitor for a process tree given root PIDs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "pydantic>=2",
]

[tool.setuptools.packages.find]
where = ["src"]
