[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afl-cpu-monitor"
version = "0.1.0"
description = "CPU usage monitor for AFL++ fuzzing process trees"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["src"]
